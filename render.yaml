# render.yaml
# Production Blueprint for CCG × OpenAI Competition Platform
# Inter Miami’s Messi Dilemma Case Competition

databases:
  - name: ccg-postgres
    databaseName: ccg_competition
    user: ccg_admin
    plan: free
    ipAllowList: []

services:
  # Express API Backend Service
  - type: web
    name: ccg-case-backend
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      # Client origins allowed for CORS and secure session cookies
      - key: CLIENT_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ccg-postgres
          property: connectionString
      # ── Organizer & Security ──────────────────────────────────────────────
      # Required: Strong unique organizer passkey configured in Render dashboard
      - key: ORGANIZER_SECRET_KEY
        sync: false
      # ── AI Case Judge Pipeline (Featherless AI) ───────────────────────────
      - key: AI_JUDGE_ENABLED
        value: "true"
      - key: AI_PROVIDER
        value: featherless
      - key: FEATHERLESS_MODEL
        value: "meta-llama/Llama-3.2-11B-Vision-Instruct"
      - key: FEATHERLESS_API_KEY
        sync: false
      - key: AI_JUDGE_BUDGET_USD
        value: "50.0"
      - key: OPENAI_API_KEY
        sync: false
      # ── Object Storage (Cloudflare R2 / AWS S3) ───────────────────────────
      # Persistent deck storage for containerized environments without persistent disks
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ENDPOINT
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
