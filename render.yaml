# render.yaml
# Staging Blueprint for CCG × OpenAI Competition Platform
#
# STAGING CONFIGURATION — OTP microservice intentionally excluded.
# The Python Webmail OTP service (otp_server.py) is preserved in the repository.
# To re-enable it for production:
#   1. Uncomment the "ccg-webmail-otp-service" service block below.
#   2. Uncomment the OTP_SERVICE_URL fromService reference in ccg-case-backend.
#   3. Set SMTP_USER and SMTP_PASS in the OTP service environment on Render.
#   4. Change OTP_ENABLED from "false" to "true" in ccg-case-backend.
#   5. Redeploy both services.

databases:
  - name: ccg-postgres
    databaseName: ccg_competition
    user: ccg_admin
    plan: free
    ipAllowList: []

services:
  # 1. Express API Backend Service
  - type: web
    name: ccg-case-backend
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      # Set CLIENT_ORIGIN to your Vercel frontend URL after first deploy.
      # Example: https://your-project.vercel.app
      - key: CLIENT_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ccg-postgres
          property: connectionString
      # ── OTP Configuration ─────────────────────────────────────────────────
      # OTP_ENABLED=false disables participant login endpoints (returns HTTP 503)
      # and shows a staging notice on the login page.
      # OTP_SERVICE_URL is unused while OTP_ENABLED=false; kept for reference.
      - key: OTP_ENABLED
        value: "false"
      - key: OTP_SERVICE_URL
        value: "http://localhost:5001"
      # ── When re-enabling the OTP service, replace the static value above with:
      # - key: OTP_SERVICE_URL
      #   fromService:
      #     name: ccg-webmail-otp-service
      #     type: web
      #     property: host
      - key: OTP_SERVICE_SHARED_SECRET
        generateValue: true
      # ── Admin & Security ──────────────────────────────────────────────────
      # REQUIRED: Set a strong, unique passkey in the Render dashboard.
      # Do NOT leave this as the default placeholder.
      - key: ORGANIZER_SECRET_KEY
        sync: false
      - key: DATA_DIR
        value: /data
      # ── AI Judge Configuration ────────────────────────────────────────────
      # AI judge disabled in staging; enable only after OTP auth is live.
      - key: AI_JUDGE_ENABLED
        value: "false"
      - key: AI_PROVIDER
        value: openai
      - key: AI_JUDGE_BUDGET_USD
        value: "50.0"
      - key: OPENAI_API_KEY
        sync: false
      - key: FEATHERLESS_API_KEY
        sync: false
      # ── Object Storage (S3 / Cloudflare R2) ──────────────────────────────
      # When omitted, uploaded decks are stored on the persistent disk below.
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ENDPOINT
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

  # 2. Python Webmail OTP Authentication Microservice
  # ── COMMENTED OUT FOR STAGING ─────────────────────────────────────────────
  # Uncomment this entire block when you are ready to enable OTP login.
  # Requires SMTP credentials (SMTP_USER, SMTP_PASS) set in the Render dashboard.
  #
  # - type: web
  #   name: ccg-webmail-otp-service
  #   env: python
  #   plan: free
  #   buildCommand: pip install -r requirements.txt
  #   startCommand: gunicorn otp_server:app --bind 0.0.0.0:$PORT
  #   healthCheckPath: /api/health
  #   envVars:
  #     - key: PORT
  #       value: 5001
