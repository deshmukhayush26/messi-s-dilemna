  #       generateValue: true
  #     - key: DEV_BYPASS_OTP
  #       value: "false"
  #     - key: SMTP_HOST
  #       value: "smtp-auth.iitb.ac.in"
  #     - key: SMTP_PORT
  #       value: "587"
  #     - key: SMTP_USER
  #       sync: false
  #     - key: SMTP_PASS
  #       sync: false
  #     - key: OTP_EXPIRY_SEC
  #       value: "600"
  #     - key: OTP_SERVICE_SHARED_SECRET
  #       fromService:
  #         name: ccg-case-backend
  #         type: web
  #         envVarKey: OTP_SERVICE_SHARED_SECRET

# ── Vercel Frontend Configuration ─────────────────────────────────────────────
# The frontend is deployed separately on Vercel. Set these Vercel environment
# variables in the Vercel dashboard under Project → Settings → Environment Variables:
#
#   VITE_API_URL = https://ccg-case-backend.onrender.com
#
# Replace the URL above with the actual service URL shown in your Render dashboard
# after the first deploy. Leave it empty for local development (Vite proxy is used).
